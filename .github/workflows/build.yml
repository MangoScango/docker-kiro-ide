name: Build and publish image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Daily check for a new Kiro release; only builds when the version tag isn't published yet.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      kiro_version:
        description: "Kiro version to build (blank = latest stable)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Kiro version
        id: kiro
        run: |
          VERSION="${{ github.event.inputs.kiro_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL https://prod.download.desktop.kiro.dev/stable/metadata-linux-x64-deb-stable.json | jq -r .currentRelease)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Kiro version: $VERSION"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip scheduled run if this version is already published
        id: check
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect "${{ steps.kiro.outputs.image }}:${{ steps.kiro.outputs.version }}" > /dev/null 2>&1; then
            echo "Version ${{ steps.kiro.outputs.version }} already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - name: Image metadata
        id: meta
        if: steps.check.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.kiro.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.kiro.outputs.version }},enable={{is_default_branch}}
            type=sha
            type=ref,event=pr

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KIRO_VERSION=${{ steps.kiro.outputs.version }}
            VERSION=${{ steps.kiro.outputs.version }}
            BUILD_DATE=${{ steps.kiro.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
